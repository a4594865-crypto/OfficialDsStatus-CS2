name: OfficialDsStatus-CS2 Build and Release

on:
  pull_request:
    branches: [ "main" ]
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'preview'
      
      # 🎯 修正 1：不寫死檔名！dotnet restore 會自動抓最外層唯一的那個專案檔
      - name: Restore dependencies
        run: dotnet restore
      
      # 🎯 修正 2：同樣不寫死檔名！直接對當前目錄編譯，並自動建立 addons 目錄結構
      - name: Build Plugin
        run: dotnet build -c Release --no-restore -o ./addons/counterstrikesharp/plugins/OfficialDsStatus-CS2

      - name: Create release asset
        if: github.event_name == 'release'
        run: zip -r OfficialDsStatus-CS2-${{ github.event.release.tag_name }}.zip ./addons/

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./OfficialDsStatus-CS2-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
