name: OfficialDsStatus-CS2 Build and Release

on:
  pull_request:
    branches: [ "main" ]
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'preview'
      
      - name: Restore dependencies
        # 🎯 修正 1：告訴 GitHub 先點進你的子資料夾（如果你的子資料夾名稱不同，請自行修改）
        working-directory: ./OfficialDsStatus-CS2
        # 🎯 進去之後，直接對當前目錄（.）進行 restore 即可
        run: dotnet restore
      
      - name: Build Plugin
        # 🎯 修正 2：同樣先點進子資料夾
        working-directory: ./OfficialDsStatus-CS2
        # 🎯 編譯完成後，把輸出的檔案往外推（../），集中到根目錄的 addons 資料夾裡
        run: dotnet build -c Release --no-restore -o ../addons/counterstrikesharp/plugins/OfficialDsStatus-CS2

      - name: Create release asset
        if: github.event_name == 'release'
        run: zip -r OfficialDsStatus-CS2-${{ github.event.release.tag_name }}.zip ./addons/

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./OfficialDsStatus-CS2-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
